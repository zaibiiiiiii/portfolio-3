<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fcfcfb" />
    <title>Page not found | Syed Zohaib Kashif</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fcfcfb;
        --ink: #101619;
        --text-secondary: #45535a;
        --hairline: #e5eaeb;
        --accent: #0e7086;
        --font-display: 'Space Grotesk', sans-serif;
        --font-body: 'DM Sans', sans-serif;
        --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Menlo', monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--ink);
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 640px;
        padding: clamp(40px, 7vw, 72px);
        border-radius: 26px;
        border: 1px solid #1d2c31;
        background:
          radial-gradient(ellipse at 8% 0%, rgba(23, 160, 142, 0.16), transparent 52%),
          linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(160deg, #10191d 0%, #0c1316 55%, #0e161a 100%);
        background-size: auto, 44px 44px, 44px 44px, auto;
        color: #e8f0ef;
        box-shadow: 0 40px 90px rgba(16, 22, 25, 0.3);
      }
      .code {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #66c9ae;
      }
      h1 {
        font-family: var(--font-display);
        font-size: clamp(56px, 12vw, 96px);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 14px 0 12px;
        color: transparent;
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.35);
      }
      p {
        max-width: 42ch;
        font-size: 15px;
        line-height: 1.7;
        color: #9fb2b5;
        margin-bottom: 28px;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .btn--primary { background: #fff; color: var(--ink); }
      .btn--primary:hover { background: #66c9ae; }
      .btn--ghost { border: 1px solid rgba(255, 255, 255, 0.2); color: #e8f0ef; }
      .btn--ghost:hover { border-color: #66c9ae; color: #66c9ae; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">Error 404 · Broken route</p>
      <h1>404</h1>
      <p>
        This route does not exist — much like a feature without error handling.
        The portfolio you are looking for is one tap away.
      </p>
      <div class="actions">
        <a class="btn btn--primary" href="/">Back to the portfolio</a>
        <a class="btn btn--ghost" href="/#contact">Contact Zohaib</a>
      </div>
    </main>
  </body>
</html>
